<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 목록</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen py-8">
  <div class="max-w-2xl mx-auto px-4">
    <!-- 제목 -->
    <h1 class="text-4xl font-bold text-center text-gray-800 mb-8">할 일 목록</h1>

    <!-- 입력 카드 -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
      <div class="flex gap-2">
        <input
          type="text"
          id="todoInput"
          placeholder="새로운 할 일을 입력하세요..."
          class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          onkeypress="if(event.key === 'Enter') addTodo()"
        >
        <button
          onclick="addTodo()"
          class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-lg transition-colors"
        >
          추가
        </button>
      </div>
    </div>

    <!-- 할 일 목록 -->
    <div id="todoList" class="space-y-3">
      <!-- 할 일 항목들이 여기에 동적으로 추가됨 -->
    </div>

    <!-- 빈 상태 메시지 -->
    <div id="emptyMessage" class="text-center text-gray-500 mt-10">
      <p class="text-lg">아직 할 일이 없습니다 😊</p>
    </div>
  </div>

  <script>
    let todos = [];

    // 페이지 로드 시 localStorage에서 데이터 가져오기
    function loadTodos() {
      const saved = localStorage.getItem('todos');
      if (saved) {
        todos = JSON.parse(saved);
        renderTodos();
      }
    }

    // localStorage에 데이터 저장
    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    // 할 일 추가
    function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();

      if (text === '') {
        alert('할 일을 입력해주세요!');
        return;
      }

      todos.push({
        id: Date.now(),
        text: text,
        completed: false
      });

      input.value = '';
      saveTodos();
      renderTodos();
    }

    // 할 일 삭제
    function deleteTodo(id) {
      todos = todos.filter(todo => todo.id !== id);
      saveTodos();
      renderTodos();
    }

    // 할 일 완료 상태 토글
    function toggleTodo(id) {
      todos = todos.map(todo =>
        todo.id === id ? { ...todo, completed: !todo.completed } : todo
      );
      saveTodos();
      renderTodos();
    }

    // 화면에 렌더링
    function renderTodos() {
      const listDiv = document.getElementById('todoList');
      const emptyMsg = document.getElementById('emptyMessage');

      listDiv.innerHTML = '';

      if (todos.length === 0) {
        emptyMsg.style.display = 'block';
        return;
      }

      emptyMsg.style.display = 'none';

      todos.forEach(todo => {
        const item = document.createElement('div');
        item.className = 'bg-white rounded-lg shadow-md p-4 flex items-center gap-3';

        item.innerHTML = `
          <input
            type="checkbox"
            ${todo.completed ? 'checked' : ''}
            onchange="toggleTodo(${todo.id})"
            class="w-5 h-5 text-blue-500 rounded cursor-pointer"
          >
          <span class="flex-1 text-gray-800 ${todo.completed ? 'line-through text-gray-400' : ''}">
            ${escapeHtml(todo.text)}
          </span>
          <button
            onclick="deleteTodo(${todo.id})"
            class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded transition-colors text-sm"
          >
            삭제
          </button>
        `;

        listDiv.appendChild(item);
      });
    }

    // XSS 방지
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 페이지 로드 시 실행
    loadTodos();
  </script>
</body>
</html>
