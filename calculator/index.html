<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gradient-to-br from-gray-900 to-gray-800 min-h-screen flex items-center justify-center">
    <div class="w-80">
        <div class="bg-gray-800 rounded-2xl shadow-2xl p-6">
            <h1 class="text-white text-2xl font-bold mb-6 text-center">계산기</h1>

            <!-- 디스플레이 -->
            <div class="bg-gray-900 rounded-lg p-4 mb-6 border border-gray-700">
                <input
                    type="text"
                    id="display"
                    class="w-full bg-gray-900 text-white text-right text-4xl font-bold outline-none"
                    value="0"
                    readonly
                >
            </div>

            <!-- 버튼 그리드 -->
            <div class="grid grid-cols-4 gap-3">
                <!-- 행 1 -->
                <button onclick="app.clear()" class="btn btn-function col-span-2">C</button>
                <button onclick="app.delete()" class="btn btn-function">DEL</button>
                <button onclick="app.operate('/')" class="btn btn-operator">÷</button>

                <!-- 행 2 -->
                <button onclick="app.input('7')" class="btn">7</button>
                <button onclick="app.input('8')" class="btn">8</button>
                <button onclick="app.input('9')" class="btn">9</button>
                <button onclick="app.operate('*')" class="btn btn-operator">×</button>

                <!-- 행 3 -->
                <button onclick="app.input('4')" class="btn">4</button>
                <button onclick="app.input('5')" class="btn">5</button>
                <button onclick="app.input('6')" class="btn">6</button>
                <button onclick="app.operate('-')" class="btn btn-operator">−</button>

                <!-- 행 4 -->
                <button onclick="app.input('1')" class="btn">1</button>
                <button onclick="app.input('2')" class="btn">2</button>
                <button onclick="app.input('3')" class="btn">3</button>
                <button onclick="app.operate('+')" class="btn btn-operator">+</button>

                <!-- 행 5 -->
                <button onclick="app.input('0')" class="btn col-span-2">0</button>
                <button onclick="app.decimal()" class="btn">.</button>
                <button onclick="app.calculate()" class="btn btn-equals">=</button>
            </div>
        </div>
    </div>

    <script src="js/calculator.js"></script>
</body>
</html>
